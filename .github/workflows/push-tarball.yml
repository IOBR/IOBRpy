name: Push tarball to Docker Hub
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag that contains iobrpy.tar.gz (e.g. v1.0.0)'
        required: true
      push_tag:
        description: 'Docker tag to push (e.g. latest or 1.0.0)'
        required: true
        default: 'latest'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Download tarball from release
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ inputs.release_tag }}
          fileName: "iobrpy.tar.gz"
          out-file-path: "."

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load, tag and push
        run: |
          set -euo pipefail
          OUT=$(gzip -dc iobrpy.tar.gz | docker load 2>/dev/null || docker load -i iobrpy.tar.gz)
          echo "$OUT"
          SRC=$(echo "$OUT" | sed -n 's/^Loaded image: //p' | head -n1)
          if [ -z "$SRC" ]; then
            ID=$(echo "$OUT" | sed -n 's/^Loaded image ID: //p' | head -n1)
            [ -n "$ID" ] || { echo "Cannot parse loaded image"; exit 1; }
            SRC="$ID"
          fi
          DEST="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iobrpy:${{ inputs.push_tag }}"
          docker tag "$SRC" "$DEST"
          docker push "$DEST"
