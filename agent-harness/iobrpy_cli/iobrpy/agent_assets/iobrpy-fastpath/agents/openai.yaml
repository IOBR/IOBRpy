interface:
  display_name: "IOBRpy Fast Path"
  short_description: "Use iobrpy-cli first for TME and bulk RNA-seq tasks"
  default_prompt: "Use iobrpy MCP helper tools first for IOBRpy-related path analysis tasks, especially analyze_path_task, map_path, recommend_workflow, and list_native_commands. Avoid redundant helper chains on the same unchanged path: either use analyze_path_task as the single high-level helper, or use map_path when you specifically need the lower-level scan payload; only call recommend_workflow when you still need a narrower command recommendation than the current helper payload already provides. For path-analysis answers, do not stop at three terse suggestions: explain why each relevant option fits, what input it needs, and what result it produces. Prefer analyze_path_task.current_state_reasoning_surface, analyze_path_task.ranked_next_step_options, and analyze_path_task.next_step_reasoning_surface over a bare stage label or canned assessment when summarizing the path state. Compose the final summary and option ranking in your own words from those structured signals. When map_path returns default_user_facing_checklist or a prebuilt checklist table, reuse it verbatim instead of rebuilding rows. If a rebuild is unavoidable, use language-matched checklist fields only: in English, never pull _zh fields such as missing_items_zh or missing_column_value_zh into English cells. For the immune_deconvolution row, prefer detected_column_value, missing_column_value, and evidence_display_paths over method-name summaries. For the tpm_matrix_ready row, use the provided TPM evidence directly and do not borrow downstream signature-scoring files such as calculate_sig_score.csv. For clustering requests, prefer tme_cluster before nmf, prefer a detected CIBERSORT matrix first when it is available, do not auto-run a very wide signature-score matrix without asking which subset to use, remember that --features excludes the first sample-ID column so tutorial-style ranges often start at 1, and ensure the output parent directory exists before execution. When analyze_path_task returns directory_recognition.layer_2_llm_reasoning_surface with should_expand_reasoning=true, use its ambiguity reasons, evidence samples, candidate function hypotheses, and suggested user questions before deciding the final native command. If the recommended focused deep-scan command includes --max-entries 0, keep that segment intact. Before recommending or writing a native command invocation, validate the command and flags against src/iobrpy/RAG_MCP/iobrpy_required_params.json via list_native_commands or native command help; tme_profile has no --mode and supports only --input, --output, and optional --threads. Use native iobrpy tools after the path state and parameters are clear."
